url: https://github.com/ecbob/dsh-window-size-keeper
name: ecbob/dsh-window-size-keeper
category: ui
description:
  en: 'Keeps the DSH desktop window the size you left it: records the main window’s last outer frame in physical pixels and restores it (centred on the work area) on the next start — before the window is ever shown, so the boot animation plays at the right resolution. The settings page adds 12 presets from 1024×768 to 3840×2160, free-form custom width/height, a centre-on-restore switch and "apply now"; selection takes effect immediately and persists. The section’s copy is bilingual (en/zh) and follows the client language you picked in DSH — switching language takes effect at once, and outside Simplified Chinese it defaults to English. Win32 via a resident PowerShell proxy, zero runtime dependencies, no outbound network.'
  zh: '让 DSH 桌面端窗口保持你离开时的大小：记录主窗口最后的外框尺寸（物理像素），下次启动恢复并居中到工作区——而且赶在窗口露面之前改完，启动动画不会播在错误分辨率上。设置页另有 12 个常用分辨率（1024×768 … 3840×2160）、任意自定义宽高、「恢复时居中」开关与「立即应用」，选中即生效并持久化。分区文案中英双语，跟随你在 DSH 里选的当前语言（切语言立即生效，不用重启），非简体中文环境默认英文。Win32 走常驻 PowerShell 代理，零运行时依赖，不发任何外部网络请求。'
